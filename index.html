<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Primary Meta Tags -->
    <title>Zivorah Pakistan | Premium Jewelry</title>
    <meta name="description" content="Shop premium jewelry in Pakistan. Discover premium rings, necklaces, bracelets and personalized gifts with fast nationwide delivery." />
    <link rel="canonical" href="https://zivorah.store/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Core Web Vitals optimizations: preconnect to backend and preload LCP images -->
    <link rel="preconnect" href="https://zivorabackend.vercel.app" />
    <link rel="dns-prefetch" href="https://zivorabackend.vercel.app" />
    <link rel="preload" as="image" href="/images/hero111.png" />
    <link rel="preload" as="image" href="/images/hero00.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zivorah.store/" />
    <meta property="og:title" content="Zivorah Pakistan | Premium Jewelry" />
    <meta property="og:description" content="Shop premium jewelry in Pakistan. Discover premium rings, necklaces, bracelets and personalized gifts with fast nationwide delivery." />
    <meta property="og:image" content="https://zivorah.store/favicon.ico" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://zivorah.store/" />
    <meta name="twitter:title" content="Zivorah Pakistan | Premium Jewelry" />
    <meta name="twitter:description" content="Shop premium jewelry in Pakistan. Discover premium rings, necklaces, bracelets and personalized gifts with fast nationwide delivery." />
    <meta name="twitter:image" content="https://zivorah.store/favicon.ico" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Zivorah",
          "alternateName": "Zivorah Pakistan",
          "url": "https://zivorah.store"
        },
        {
          "@type": "Organization",
          "name": "Zivorah",
          "url": "https://zivorah.store",
          "logo": "https://zivorah.store/favicon.ico"
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
